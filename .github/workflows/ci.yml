name: CI

# Roda em:
# - Pull Requests que miram release ou main (validação antes do merge)
# - Push direto na branch release (pós-merge do PR) -> SOMENTE CI, sem deploy
on:
  pull_request:
    branches: [release, main]
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TechChallenger.auth/TechChallenger.auth.csproj

      - name: Build
        run: dotnet build TechChallenger.auth/TechChallenger.auth.csproj --no-restore --configuration Release

      - name: Build da imagem Docker (validação, sem push)
        run: docker build -f TechChallenger.auth/Dockerfile -t auth:ci-${{ github.sha }} TechChallenger.auth

      - name: Terraform fmt/validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate
