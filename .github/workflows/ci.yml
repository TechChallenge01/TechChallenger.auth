name: CI

# Valida antes do merge. Sem credenciais AWS, sem deploy.
on:
  pull_request:
    branches: [develop, release, main]
  push:
    branches: [develop, release]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TechChallenger.auth.slnx

      - name: Build
        run: dotnet build TechChallenger.auth.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TechChallenger.auth.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Build da imagem Docker (validacao, sem push)
        run: docker build -f TechChallenger.auth/Dockerfile -t auth:ci-${{ github.sha }} TechChallenger.auth

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validar codigo do Lambda authorizer
        run: node --check terraform/src-authorizer/index.mjs

      - name: Terraform fmt (advisory)
        working-directory: terraform
        run: terraform fmt -check -recursive -diff || echo "::warning::terraform fmt pendente — rode 'terraform fmt -recursive'"

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
